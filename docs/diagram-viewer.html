<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinVue Workflow Diagram Viewer</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: rgba(255, 255, 255, 0.82);
        --border: #dbe4f0;
        --text: #0f172a;
        --muted: #475569;
        --accent: #6d5ef7;
        --accent-dark: #4f46e5;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 48%, #f5f3ff 100%);
        color: var(--text);
      }

      .page {
        max-width: 1200px;
        margin: 48px auto;
        padding: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
        padding: 20px;
        backdrop-filter: blur(12px);
      }

      .header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button, .link-btn {
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(109, 94, 247, 0.2);
        background: white;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.94rem;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }

      button:hover, .link-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(79, 70, 229, 0.4);
        background: #f5f3ff;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        color: white;
        border-color: transparent;
      }

      .viewer-shell {
        border: 1px solid var(--border);
        background: #ffffff;
        border-radius: 16px;
        padding: 18px;
        overflow: auto;
        min-height: 520px;
      }

      .image-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 480px;
        overflow: auto;
        border-radius: 12px;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        border: 1px solid #edf2f7;
        cursor: grab;
      }

      .image-wrap.dragging {
        cursor: grabbing;
      }

      img {
        max-width: none;
        display: block;
        border-radius: 10px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
        transition: transform 0.18s ease;
        transform-origin: center center;
      }

      .status {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 640px) {
        .page { padding: 12px; }
        .panel { padding: 14px; }
        .viewer-shell { padding: 10px; }
        .image-wrap { min-height: 300px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="panel">
        <div class="header">
          <h1>FinVue Workflow Diagram</h1>
          <div class="actions">
            <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
            <button id="zoomReset" type="button" class="primary" aria-label="Reset zoom">Reset</button>
            <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
            <a class="link-btn" href="./diagrams/finvue-workflow.png" target="_blank" rel="noreferrer">Open Original</a>
          </div>
        </div>

        <div class="viewer-shell">
          <div class="image-wrap">
            <img id="workflowImage" src="./diagrams/finvue-workflow.png" alt="FinVue workflow diagram" />
          </div>
        </div>

        <div class="status">
          Zoom level: <strong id="zoomValue">100%</strong>
        </div>
      </div>
    </div>

    <script>
      const img = document.getElementById('workflowImage');
      const zoomValue = document.getElementById('zoomValue');
      const imageWrap = document.querySelector('.image-wrap');
      let zoom = 1;
      let dragState = null;

      function applyZoom() {
        const width = 900 * zoom;
        img.style.width = `${width}px`;
        img.style.maxWidth = 'none';
        zoomValue.textContent = `${Math.round(zoom * 100)}%`;
      }

      document.getElementById('zoomIn').addEventListener('click', () => {
        zoom = Math.min(zoom + 0.1, 2.5);
        applyZoom();
      });

      document.getElementById('zoomOut').addEventListener('click', () => {
        zoom = Math.max(zoom - 0.1, 0.5);
        applyZoom();
      });

      document.getElementById('zoomReset').addEventListener('click', () => {
        zoom = 1;
        applyZoom();
      });

      imageWrap.addEventListener('wheel', (event) => {
        event.preventDefault();
        const delta = event.deltaY < 0 ? 0.08 : -0.08;
        zoom = Math.min(Math.max(zoom + delta, 0.5), 2.5);
        applyZoom();
      }, { passive: false });

      imageWrap.addEventListener('mousedown', (event) => {
        dragState = {
          startX: event.clientX,
          startY: event.clientY,
          scrollLeft: imageWrap.scrollLeft,
          scrollTop: imageWrap.scrollTop,
        };
        imageWrap.classList.add('dragging');
      });

      imageWrap.addEventListener('mousemove', (event) => {
        if (!dragState) return;
        const dx = event.clientX - dragState.startX;
        const dy = event.clientY - dragState.startY;
        imageWrap.scrollLeft = dragState.scrollLeft - dx;
        imageWrap.scrollTop = dragState.scrollTop - dy;
      });

      const stopDragging = () => {
        dragState = null;
        imageWrap.classList.remove('dragging');
      };

      imageWrap.addEventListener('mouseup', stopDragging);
      imageWrap.addEventListener('mouseleave', stopDragging);
      imageWrap.addEventListener('touchstart', (event) => {
        const touch = event.touches[0];
        dragState = {
          startX: touch.clientX,
          startY: touch.clientY,
          scrollLeft: imageWrap.scrollLeft,
          scrollTop: imageWrap.scrollTop,
        };
      }, { passive: true });

      imageWrap.addEventListener('touchmove', (event) => {
        if (!dragState) return;
        const touch = event.touches[0];
        const dx = touch.clientX - dragState.startX;
        const dy = touch.clientY - dragState.startY;
        imageWrap.scrollLeft = dragState.scrollLeft - dx;
        imageWrap.scrollTop = dragState.scrollTop - dy;
      }, { passive: true });

      imageWrap.addEventListener('touchend', stopDragging);
      applyZoom();
    </script>
  </body>
</html>
